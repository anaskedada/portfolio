<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Anass Kedada – Développeur Backend PHP / Symfony</title>
    <meta
      name="description"
      content="Anass Kedada, développeur Backend PHP / Symfony – Full Stack à Rabat. Applications métier sur mesure : e-commerce, back-offices multi-rôles, API REST et intégrations de paiement."
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#11151b" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Dark mode by default; a visitor's saved choice (via the toggle) wins.
      // Runs before first paint to avoid a flash.
      (function () {
        var t = 'dark';
        try {
          var saved = localStorage.getItem('theme');
          if (saved === 'light' || saved === 'dark') t = saved;
        } catch (e) {}
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
